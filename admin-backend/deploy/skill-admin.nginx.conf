server {
    listen 80;
    listen [::]:80;
    server_name t3-code.adityakinjawadekar.com;
    location /.well-known/acme-challenge/ {
        root /var/www/skill-admin-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name t3-code.adityakinjawadekar.com;
    ssl_certificate /etc/letsencrypt/live/t3-code.adityakinjawadekar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/t3-code.adityakinjawadekar.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    auth_basic "T3 settings";
    auth_basic_user_file /etc/nginx/skill-admin.htpasswd;
    client_max_body_size 1m;

    location = /internal {
        return 404;
    }
    location / {
        proxy_pass http://127.0.0.1:18340;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 45s;
    }
}
